# MetricBase Platform — single-VPS deployment.
# Postgres runs as a local service (postgres). Traffic enters via Cloudflare Tunnel.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metricbase_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - postgres
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # The bot is a thin client: it calls the web service's /api/bot/* with
      # BOT_SERVICE_TOKEN rather than touching the database directly.
      PLATFORM_API_BASE: "http://web:3000"
    depends_on:
      - web
    restart: unless-stopped

  # FieldFlow compute engine (Phase 3 hybrid): the proven Python analytics,
  # metrics, and formula-DSL code runs here, READ-ONLY against the shared
  # Postgres. Next.js owns the schema + all writes via Prisma; /api/field/*
  # proxies analytics/dashboard/formula requests to this service. Wired up in
  # Phase 3b — this is the service slot.
  field-engine:
    build:
      context: ./field-engine
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      FIELD_ENGINE_TOKEN: "${FIELD_ENGINE_TOKEN}"
    expose:
      - "5001"
    depends_on:
      - postgres
      - web
    restart: unless-stopped

  # In-cluster scheduler: busybox crond calls the platform's /api/cron/* routes
  # on a schedule (digest, recurring rollover, agent sweep). Auth via CRON_SECRET
  # (must be set in .env). No Docker socket, no image build. Edit cron/entrypoint.sh
  # to change schedules.
  cron:
    image: alpine:3.20
    env_file: .env
    environment:
      PLATFORM_API_BASE: "http://web:3000"
    volumes:
      - ./cron/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - web
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
